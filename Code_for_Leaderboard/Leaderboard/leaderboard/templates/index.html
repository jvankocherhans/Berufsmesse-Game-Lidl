<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        function updateScoreboard() {
            fetch('/getScoreboard')
                .then(response => response.json())
                .then(data => {
                    let scoreboard = document.getElementById('scoreboard');
                    scoreboard.innerHTML = '';
                    data.forEach(player => {
                        let row = document.createElement('tr');
                        let userIdCell = document.createElement('td');
                        let scoreCell = document.createElement('td');
                        userIdCell.textContent = player.userID;
                        scoreCell.textContent = player.score;
                        row.appendChild(userIdCell);
                        row.appendChild(scoreCell);
                        scoreboard.appendChild(row);
                    });
                });
        }

        setInterval(updateScoreboard, 5000);  // Aktualisiere alle 5 Sekunden
    </script>
</head>
<body>
    <h1>Leaderboard</h1>
    <table id="scoreboard">
        <!-- Scoreboard Daten werden hier eingefügt -->
    </table>
    <button onclick="window.location.href='/exportTop3'">Export Top 3</button>
</body>
</html>
